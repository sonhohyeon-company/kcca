name: kcca

services:
  web:
    image: ${KCCA_IMAGE_REF:?KCCA_IMAGE_REF is required}
    container_name: kcca
    restart: unless-stopped
    init: true

    ports:
      - "127.0.0.1:8082:8080"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    pids_limit: 256
    mem_limit: ${WEB_MEMORY_LIMIT:-1g}
    cpus: ${WEB_CPU_LIMIT:-1.5}
