# 서버(호스트) nginx 설정 예시. 앱 컨테이너는 127.0.0.1:8082에서만 받습니다.
# 인증서 경로는 certbot 등으로 발급한 실제 경로로 바꾸세요.

server {
    listen 80;
    listen [::]:80;
    server_name kcca-society.kr www.kcca-society.kr;
    return 301 https://kcca-society.kr$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kcca-society.kr www.kcca-society.kr;

    ssl_certificate     /etc/letsencrypt/live/kcca-society.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kcca-society.kr/privkey.pem;

    # 한 번 접속한 브라우저는 다음부터 https로만 접속합니다 (관리자 비밀번호 보호).
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # 앱(Next)은 파일이 든 요청을 45MB까지 메모리에 받습니다. 로그인하지 않은 사람도 보낼 수
        # 있으므로, 올리기가 필요 없는 경로는 여기서 작게 막습니다.
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        # Host는 관리자 화면 저장(Server Actions)의 출처 확인에 필요합니다.
        proxy_set_header Host $host;
        # 클라이언트가 보낸 값을 덮어씁니다. 앱은 이 값을 Host보다 먼저 봅니다.
        proxy_set_header X-Forwarded-Host $host;
        # 앱은 X-Forwarded-For의 맨 오른쪽 값을 접속 IP로 씁니다(로그인 시도 제한).
        # nginx 앞에 Cloudflare 같은 프록시가 또 있으면 real_ip 모듈로 실제 IP를 복원하세요.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 선택: 스트리밍 응답을 바로 전달
        proxy_buffering off;

        # 관리자 사진·첨부 업로드 (앱 한도: 파일당 20MB, 한 번 저장에 45MB)
        location /admin {
            client_max_body_size 50m;
            proxy_pass http://127.0.0.1:8082;
        }
        # 시험 접수 신청서 첨부 (앱 한도: 20MB)
        location = /application-form {
            client_max_body_size 25m;
            proxy_pass http://127.0.0.1:8082;
        }
    }
}
