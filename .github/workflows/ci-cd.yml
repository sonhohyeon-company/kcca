name: CI and production deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: true

      - name: Install locked dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Build production application
        run: npm run build

  image:
    name: Publish image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Define immutable image reference
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_ref=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Create BuildKit builder
        run: |
          docker buildx create --name kcca-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and publish immutable image
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --pull \
            --provenance=mode=max \
            --sbom=true \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            --push .

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io || true

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://kcca.ranpick.com
    concurrency:
      group: kcca-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: lotto.ranpick.com
      DEPLOY_USER: sjw
      DEPLOY_PORT: "22"
      DEPLOY_PATH: /home/sjw/kcca
      IMAGE_REF: ${{ needs.image.outputs.image_ref }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure verified SSH connection
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "DEPLOY_SSH_KEY is required" >&2; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "DEPLOY_KNOWN_HOSTS is required" >&2; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

      - name: Copy deployment definition
        shell: bash
        run: |
          ssh -p "$DEPLOY_PORT" -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -P "$DEPLOY_PORT" -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            deploy/compose.production.yml deploy/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Pull image and deploy with rollback
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh_args=(
            -p "$DEPLOY_PORT"
            -i "$HOME/.ssh/deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          cleanup() {
            ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker logout ghcr.io >/dev/null 2>&1 || true" || true
          }
          trap cleanup EXIT
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin"
          ssh "${ssh_args[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && chmod 700 deploy.sh && KCCA_IMAGE_REF='$IMAGE_REF' ./deploy.sh"
